const accepted=state.cards.filter(c=>c.status==='accepted'),total=accepted.length*(state.reverse?2:1);
if(state.nav==='cards')return `<div class="simple-page">${pageHead('CARDS','我的卡片','查看学习记录，整理卡片，并从这里开始学习。')}<section class="panel accepted-list"><div class="stats"><div class="stat"><strong>0</strong><span>今日待复习</span></div><div class="stat"><strong>${total}</strong><span>今日新词</span></div><div class="stat"><strong>${total}</strong><span>总卡片数</span></div></div><h3 style="margin-top:24px">学习记录</h3><p class="muted-line">原型尚无学习记录</p><div style="display:grid;grid-template-columns:repeat(26,1fr);gap:4px;margin:16px 0" aria-label="空白学习记录">${Array.from({length:182},()=>'<span style="aspect-ratio:1;background:#e9eaf0;border-radius:2px"></span>').join('')}</div><button class="button primary" style="width:100%;min-height:52px" data-action="study-preview" ${total?'':'disabled'}>▶ 开始学习</button></section><section class="panel accepted-list" style="margin-top:20px"><h3>我的卡片 · ${total} 张</h3>${acceptedRows()}${total?'':'<button class="button" data-action="go-add">添加卡片</button>'}</section></div>`;
if(state.nav==='learn'){const c=accepted[0];return `<div class="simple-page"><button class="button ghost" data-nav="cards">‹ 返回我的卡片</button>${pageHead('STUDY','专注学习','学习入口统一放在卡片页。此处仅演示学习布局，不写入进度。')}<section class="panel accepted-list">${c?`<span class="face-label">单词 / 短语</span><h1>${esc(c.word)}</h1><p>${esc(c.ipa)}</p><details style="margin-top:24px"><summary class="button primary">查看答案</summary><h2 style="margin-top:24px">${esc(c.meaning)}</h2><p>${esc(c.example)}</p><p>${esc(c.translation)}</p></details>`:'暂无已接受卡片'}</section></div>`;}
return `<div class="simple-page">${pageHead('SETTINGS','设置','这是一份独立交互原型。')}<div class="panel accepted-list"><h2>模型与数据</h2><p>实际产品会把所选文本发送至已配置模型；本原型使用本地示例数据，不发送模型请求。</p></div></div>`;
}
function render(){document.querySelector('.topnav').hidden=state.nav==='learn';document.querySelectorAll('.navitem').forEach(x=>x.classList.toggle('active',x.dataset.nav===state.nav));let html=state.nav!=='add'?renderOther():state.sub==='word'?renderWordTab():state.stage==='import'?renderImport():state.stage==='config'?renderConfig():state.stage==='generate'?renderGenerate():state.stage==='review'?renderReview():renderComplete(state.stage==='accepted');$('#screen').innerHTML=html;wireDropzone();if(state.nav==='add'&&state.stage==='config'&&state.parseError)showParseError()}
function startDemo(){clearTimeout(timer);state={...initial(),nav:'add',history:state.history,stage:'config',mode:'demo',file:{name:'Atomic Habits · 英文节选',size:'示例文档',type:'DEMO'},runId:Date.now().toString(36)};persist();render();}
function selectFile(file){if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();if(!['pdf','docx'].includes(ext)){showToast('文件类型不支持，请选择 PDF 或 DOCX。');return}if(file.size>50*1024*1024){showToast('文件超过 50 MB 的原型展示上限。');return}state.file={name:file.name,size:file.size<1024*1024?Math.max(1,Math.round(file.size/1024))+' KB':(file.size/1024/1024).toFixed(1)+' MB',type:ext.toUpperCase()};state.mode='local-simulated';state.stage='config';state.runId=Date.now().toString(36);state.cards=[];state.checked=[];state.selectedId=null;state.phase='idle';persist();render();showToast('已选择文件；后续使用示例内容模拟解析。')}
function wireDropzone(){const d=$('#dropzone');if(!d)return;d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('drag')});d.addEventListener('dragleave',()=>d.classList.remove('drag'));d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('drag');selectFile(e.dataTransfer.files[0])})}
function addBatch(){if(state.phase!=='running')return;if(state.failNext){state.failNext=false;state.phase='failed';persist();render();return}const source=words.slice(0,state.target),next=source.find(w=>!state.cards.some(c=>c.id===w.id));if(!next){finishGeneration();return}state.cards.push({...clone(next),status:'pending'});state.selectedId=state.selectedId||next.id;state.batch++;persist();render();if(state.cards.length>=state.target){timer=setTimeout(finishGeneration,650)}else{timer=setTimeout(addBatch,850)}}
function finishGeneration(){clearTimeout(timer);state.phase='done';saveHistory();persist();render()}
function saveHistory(){if(!state.runId)return;const item={id:state.runId,name:state.file?.name||'示例文档',date:new Date().toLocaleDateString('zh-CN'),cards:clone(state.cards),reverse:state.reverse,target:state.target,mode:state.mode,file:state.file};const ix=state.history.findIndex(h=>h.id===item.id);if(ix>=0)state.history[ix]=item;else state.history.push(item);state.history=state.history.slice(-5)}
function beginGeneration(){state.cards=[];state.selectedId=null;state.checked=[];state.stage='generate';state.phase='running';state.batch=0;persist();render();timer=setTimeout(addBatch,800)}
function continueGeneration(){clearTimeout(timer);state.stage='generate';state.phase='running';persist();render();timer=setTimeout(addBatch,550)}
function stopGeneration(){clearTimeout(timer);state.phase='stopped';saveHistory();persist();render()}
function updateCard(id,fn){const c=state.cards.find(x=>x.id===id);if(!c)return;fn(c);saveHistory();persist();render()}
function deleteIds(ids){const before=clone(state.cards);let changed=0;ids.forEach(id=>{const c=state.cards.find(x=>x.id===id);if(c&&c.status!=='deleted'){c.status='deleted';changed++}});state.checked=[];saveHistory();persist();render();if(changed)showToast(`已删除 ${changed} 个词条`,()=>{state.cards=before;saveHistory();persist();render();showToast('删除已撤销。')})}
function acceptIds(ids){let changed=0;ids.forEach(id=>{const c=state.cards.find(x=>x.id===id);if(c&&c.status==='pending'){c.status='accepted';changed++}});state.checked=[];saveHistory();persist();render();showToast(changed?`已接受 ${changed} 个词条。`:'没有可接受的待审核词条。')}
function openEdit(id){const c=state.cards.find(x=>x.id===id);if(!c)return;$('#edit-body').innerHTML=`<p class="section-sub">修改后正向与反向卡片会同步更新。</p><div class="field"><label for="edit-word">单词</label><input id="edit-word" value="${esc(c.word)}"></div><div class="field"><label for="edit-ipa">音标</label><input id="edit-ipa" value="${esc(c.ipa)}"></div><div class="field"><label for="edit-meaning">中文词义</label><input id="edit-meaning" value="${esc(c.meaning)}"></div><div class="field"><label for="edit-example">英文例句</label><textarea id="edit-example">${esc(c.example)}</textarea></div><div class="field"><label for="edit-translation">例句翻译</label><textarea id="edit-translation">${esc(c.translation)}</textarea></div>`;$('#edit-foot').innerHTML=`<button class="button" data-close-dialog>取消</button><button class="button primary" data-action="save-edit" data-id="${esc(id)}">保存修改</button>`;$('#edit-dialog').showModal();$('#edit-word').focus()}
function openRegen(id){const c=state.cards.find(x=>x.id===id);if(!c||c.status!=='pending')return;regenDraft=null;regenFailure=false;$('#regen-body').innerHTML=`<p class="section-sub">先描述想改进的方向。新版本生成后，可对照旧稿再决定是否采用。</p><div class="field"><label for="regen-request">重新生成要求</label><textarea id="regen-request" placeholder="例如：解释更简洁，例句贴近日常生活"></textarea></div><label style="display:flex;gap:8px;align-items:center;font-size:12px;margin-top:15px;color:var(--muted)"><input type="checkbox" id="regen-fail"> 模拟本次生成失败</label><div id="regen-result"></div>`;$('#regen-foot').innerHTML=`<button class="button" data-close-dialog>取消</button><button class="button primary" data-action="make-regeneration" data-id="${esc(id)}">生成新版本</button>`;$('#regen-dialog').showModal();$('#regen-request').focus()}
function makeRegen(id){const c=state.cards.find(x=>x.id===id);if(!c)return;const req=$('#regen-request').value.trim();if(!req){$('#regen-request').focus();showToast('请先写下重新生成要求。');return}regenFailure=$('#regen-fail').checked;const foot=$('#regen-foot');foot.innerHTML=`<button class="button" data-close-dialog>取消</button><button class="button primary" disabled>正在生成…</button>`;setTimeout(()=>{if(!$('#regen-dialog').open)return;if(regenFailure){$('#regen-result').innerHTML='<div class="notice error">模拟生成失败，旧稿未改变。可以取消或重试。</div>';foot.innerHTML=`<button class="button" data-close-dialog>取消</button><button class="button primary" data-action="retry-regeneration" data-id="${esc(id)}">重试生成</button>`;return}regenDraft={...clone(c),meaning:req.includes('简洁')?c.meaning.split('；')[0]:c.alt,example:c.example,translation:c.translation};$('#regen-result').innerHTML=`<div class="compare"><div><b>当前草稿 · 仍保留</b><strong>${esc(c.word)}</strong><p>${esc(c.meaning)}</p><p>${esc(c.example)}</p></div><div class="new"><b>新版本 · 根据要求模拟</b><strong>${esc(regenDraft.word)}</strong><p>${esc(regenDraft.meaning)}</p><p>${esc(regenDraft.example)}</p></div></div>`;foot.innerHTML=`<button class="button" data-close-dialog>取消</button><button class="button primary" data-action="adopt-regeneration" data-id="${esc(id)}">采用新版本</button>`},700)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){state.nav=nav.dataset.nav;persist();render();return}const sub=e.target.closest('[data-sub]');if(sub){state.sub=sub.dataset.sub;persist();render();return}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;state.selectedId=filtered()[0]?.id||null;persist();render();return}const check=e.target.closest('[data-check-card]');if(check){const id=check.dataset.checkCard;state.checked=check.checked?[...new Set([...state.checked,id])]:state.checked.filter(x=>x!==id);persist();render();return}const card=e.target.closest('[data-select-card]');if(card){state.selectedId=card.dataset.selectCard;persist();render();return}const close=e.target.closest('[data-close-dialog]');if(close){close.closest('dialog').close();return}const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action,id=action.dataset.id;switch(a){case'study-preview':state.nav='learn';render();break;case'choose-file':$('#file-input').click();break;case'start-demo':case'restart-demo':startDemo();break;case'back-import':state.stage='import';persist();render();break;case'return-import':state.sub='import';render();break;case'go-add':state.nav='add';state.sub='import';persist();render();break;case'begin-generation':beginGeneration();break;case'continue-generation':continueGeneration();break;case'stop-generation':stopGeneration();break;case'back-generation':state.stage='generate';persist();render();break;case'review':clearTimeout(timer);if(state.phase==='running')state.phase='stopped';saveHistory();state.nav='add';state.sub='import';state.stage='review';state.selectedId=state.selectedId||state.cards[0]?.id||null;persist();render();break;case'complete':saveHistory();state.stage='complete';persist();render();break;case'view-accepted':state.stage='accepted';state.nav='add';persist();render();break;case'accept':acceptIds([id]);break;case'delete':deleteIds([id]);break;case'batch-accept':acceptIds(state.checked);break;case'batch-delete':deleteIds(state.checked);break;case'edit':openEdit(id);break;case'regenerate':openRegen(id);break;case'save-edit':{const fields=['word','ipa','meaning','example','translation'];const vals=Object.fromEntries(fields.map(f=>[f,$('#edit-'+f).value.trim()]));if(!vals.word||!vals.meaning||!vals.example){showToast('请填写单词、词义和例句。');return}updateCard(id,c=>Object.assign(c,vals));$('#edit-dialog').close();showToast('修改已保存。');break}case'make-regeneration':makeRegen(id);break;case'retry-regeneration':$('#regen-fail').checked=false;makeRegen(id);break;case'adopt-regeneration':if(regenDraft)updateCard(id,c=>Object.assign(c,regenDraft));$('#regen-dialog').close();showToast('已采用新版本。');break;case'resume-history':{const h=state.history.find(x=>x.id===id);if(!h)return;clearTimeout(timer);Object.assign(state,{nav:'add',sub:'import',stage:'review',file:h.file,mode:h.mode,target:h.target,reverse:h.reverse,cards:clone(h.cards),runId:h.id,phase:'stopped',selectedId:h.cards[0]?.id||null,checked:[],filter:'all'});persist();render();break}case'parse-fail':case'scan-pdf':clearTimeout(timer);state.parseError=a;state.stage='config';persist();render();break;case'gen-fail':state.failNext=true;persist();if(state.stage==='generate'&&state.phase==='running')showToast('下一批将模拟生成失败。');else showToast('已设置：下次生成的首批将模拟失败。');break;}}
);
function showParseError(){const existing=$('#parse-error');if(existing)existing.remove();const host=$('.config-col .panel');if(!host)return;const box=document.createElement('div');box.id='parse-error';box.className='notice error';box.innerHTML=state.parseError==='scan-pdf'?'这是扫描版 PDF 演示：无法取得可复制文本。可更换为含文本的 PDF / DOCX，或重试示例解析。':'示例解析失败：未生成任何新草稿。可以重试或返回更换文件。';const actions=document.createElement('div');actions.style.marginTop='10px';actions.innerHTML='<button class="button small" data-action="retry-parse">重试解析</button> <button class="button small" data-action="back-import">更换文件</button>';box.append(actions);host.prepend(box);$('#begin-generation').disabled=true}
document.addEventListener('click',e=>{if(e.target.closest('[data-action="retry-parse"]')){state.parseError=null;persist();render();showToast('示例解析已恢复。')}});
document.addEventListener('change',e=>{if(e.target.id==='file-input')selectFile(e.target.files[0]);if(e.target.dataset.change==='target'){state.target=Number(e.target.value);persist();render()}if(e.target.dataset.change==='reverse'){state.reverse=e.target.checked;persist();render()}if(e.target.dataset.change==='difficulty'){state.difficulty=e.target.value;persist()}});
document.addEventListener('input',e=>{if(e.target.dataset.change==='requirements'){state.requirements=e.target.value;persist()}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
$('#toast-undo').addEventListener('click',()=>{const undo=undoSnapshot;undoSnapshot=null;$('#toast').classList.remove('show');if(undo)undo()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#toast').classList.contains('show'))$('#toast').classList.remove('show')});
render();
})();
</script>
</body>
</html>
