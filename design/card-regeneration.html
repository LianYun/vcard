$('entry').onclick=()=>show('input');$('more').onclick=()=>{$('menu').hidden=!$('menu').hidden;$('more').setAttribute('aria-expanded',String(!$('menu').hidden))};$('close').onclick=close;$('reset').onclick=()=>{close();$('menu').hidden=false;$('more').setAttribute('aria-expanded','true')};document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>show(b.dataset.state));document.addEventListener('keydown',e=>{if($('veil').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const items=[...document.querySelectorAll('.modal button,.modal textarea')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});const initial=new URLSearchParams(location.search).get('state');if(['input','loading','preview','error'].includes(initial))show(initial);
